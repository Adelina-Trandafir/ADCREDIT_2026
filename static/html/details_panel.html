<div id="detailsPanelContent" class="details-panel-content">
  <div id="detailsPanelLeft" class="details-panel-left">
    <form class="details-form" id="detailsForm">
      <div id="g_NumeClient" class="form-group">
        <label for="NumeClient">Nume:</label>
        <input type="text" id="NumeClient" name="NumeClient" class="form-control" />
      </div>
      <div id="g_CNPClient" class="form-group">
        <label for="CNPClient">CNP:</label>
        <input type="text" id="CNPClient" name="CNPClient" class="form-control" />
      </div>
      <div id="g_TelefonClient" class="form-group">
        <label for="TelefonClient">Telefon:</label>
        <input type="text" id="TelefonClient" name="TelefonClient" class="form-control" />
      </div>
      <div id="g_EmailClient" class="form-group">
        <label for="EmailClient">Email:</label>
        <input type="email" id="EmailClient" name="EmailClient" class="form-control" />
      </div>
      <div id="g_JudetClient" class="form-group">
        <label for="JudetClient">Județ:</label>
        <div id="div_JudetClient" class="form-control-combo"></div>
      </div>
      <div id="g_DataPrimire" class="form-group">
        <label for="DataPrimire">Data:</label>
        <input
          type="text"
          id="DataPrimire"
          name="DataPrimire"
          class="form-control"
          data-custom-datetime="true"
        />
      </div>
      <div id="g_NumeConsultant" class="form-group">
        <label for="NumeConsultant">Consultant SVN:</label>
        <div id="div_NumeConsultant" class="form-control-combo"></div>
      </div>
      <div id="g_SursaAgent" class="form-group">
        <label for="SursaAgent">Sursă / Agent:</label>
        <div id="div_SursaAgent" class="form-control-combo"></div>
      </div>
      <div id="g_aTelefon" class="form-group">
        <label for="aTelefon">Tel Agent:</label>
        <input type="text" id="aTelefon" name="aTelefon" class="form-control" />
      </div>
      <div id="g_aMail" class="form-group">
        <label for="aMail">Email Agent:</label>
        <input type="email" id="aMail" name="aMail" class="form-control" />
      </div>
    </form>
  </div>

  <div class="details-panel-middle">
    <div class="feedback-table-container">
      <div class="feedback-table-wrapper">
        <table class="feedback-table" id="feedbackTable">
          <thead>
            <tr>
              <th style="width: 15%; min-width: 100px; text-align: center">Data Conectare</th>
              <th style="width: 70%; text-align: center">Feedback</th>
              <th style="width: 15%; min-width: 100px; text-align: center">Dată Reconectare</th>
            </tr>
          </thead>
          <tbody id="feedbackTableBody">
            <tr>
              <td colspan="3" class="loading">Se încarcă...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="details-panel-right">
    <button class="btn btn-primary" id="btnSaveDetails">💾 Salvează</button>
    <button class="btn btn-secondary" id="btnCancelDetails">❌ Renunță</button>
  </div>
</div>
