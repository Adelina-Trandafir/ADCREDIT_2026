# =============================================================================
# ADCREDIT3 - Nginx reverse proxy config
# Pune in: /etc/nginx/sites-available/adcredit3
# Activeaza: ln -s /etc/nginx/sites-available/adcredit3 /etc/nginx/sites-enabled/
# =============================================================================

# Redirect HTTP -> HTTPS (decomentează după ce ai certificat SSL)
# server {
#     listen 80;
#     server_name DOMENIU_TAU.ro;
#     return 301 https://$host$request_uri;
# }

server {
    listen 80;
    server_name _;   # <-- schimba cu domeniu sau IP-ul serverului

    # ---------- Securitate ----------
    server_tokens off;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---------- Logging ----------
    access_log /var/log/nginx/adcredit3-access.log;
    error_log  /var/log/nginx/adcredit3-error.log warn;

    # ---------- Static files (servite direct de nginx, fara Flask) ----------
    location /static/ {
        alias /root/ADCREDIT3/static/;
        expires 1d;
        add_header Cache-Control "public, immutable";

        # Fara cache pentru JS/CSS (cache busting via query string din app)
        location ~* \.(js|css)$ {
            expires off;
            add_header Cache-Control "no-cache, must-revalidate";
        }
    }

    # ---------- Blocheaza fisiere sensibile ----------
    location ~ /\. {
        deny all;
    }
    location ~ \.(env|pyc|py|sh|service|conf)$ {
        deny all;
    }

    # ---------- Proxy catre Flask/Gunicorn ----------
    location / {
        proxy_pass http://127.0.0.1:5001;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_redirect off;
        proxy_buffering off;

        proxy_connect_timeout 60s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;

        # Mareste pentru upload-uri (16MB setat in Flask)
        client_max_body_size 20M;
    }

    # ---------- HTTPS (decomentează după certbot) ----------
    # listen 443 ssl;
    # ssl_certificate     /etc/letsencrypt/live/DOMENIU/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/DOMENIU/privkey.pem;
    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    # ssl_prefer_server_ciphers off;
    # ssl_session_cache shared:SSL:10m;
}
